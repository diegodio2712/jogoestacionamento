<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estacionamento - Fuga do Trânsito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cell-size: 16.6666%; /* 100% / 6 */
            --board-bg: #4b5563; /* gray-600 */
            --asphalt: #374151; /* gray-700 */
            --target-car: #ef4444; /* red-500 */
            --car-color: #fcd34d; /* yellow-300 */
            --truck-color: #3b82f6; /* blue-500 */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #d1d5db;
            background-image: radial-gradient(#9ca3af 15%, transparent 15%), radial-gradient(#9ca3af 15%, transparent 15%);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            touch-action: manipulation;
            margin: 0;
            overflow-x: hidden;
            color: #1f2937;
        }

        h1, h2, h3, .font-title {
            font-family: 'Baloo 2', cursive;
        }

        #game-board {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            background-color: var(--asphalt);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 8px solid #1f2937;
            margin: 0 auto;
            touch-action: none; /* Previne scroll no mobile ao arrastar */
        }

        .board-grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            pointer-events: none;
        }

        .board-cell {
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .exit-marker {
            position: absolute;
            top: 33.3333%; /* 2 rows down (2 * 16.66%) - Linha 3 (Y=2) */
            right: -24px;
            width: 24px;
            height: 16.6666%;
            background: repeating-linear-gradient(
                -45deg,
                #f59e0b,
                #f59e0b 8px,
                #1f2937 8px,
                #1f2937 16px
            );
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.4);
            z-index: 0;
        }

        .vehicle {
            position: absolute;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s ease, filter 0.2s;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,0.25), 
                        2px 4px 8px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vehicle::after {
            content: '';
            width: 50%;
            height: 30%;
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        .vehicle.vertical::after {
            width: 30%;
            height: 50%;
        }

        .vehicle:active {
            cursor: grabbing;
            z-index: 20;
            filter: brightness(1.15);
            transform: scale(0.97);
            box-shadow: 1px 2px 5px rgba(0,0,0,0.6);
        }

        .vehicle[data-type="0"] { background-color: var(--target-car); }
        .vehicle[data-type="1"] { background-color: var(--car-color); }
        .vehicle[data-type="2"] { background-color: var(--truck-color); }

        /* Ajustes de margem interna para criar o visual de "vaga" */
        .vehicle.horizontal { height: calc(var(--cell-size) - 6px); margin: 3px 0; }
        .vehicle.vertical { width: calc(var(--cell-size) - 6px); margin: 0 3px; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal.active { display: flex; }

        .btn {
            transition: all 0.1s;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: none !important;
        }

        .screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }
        .screen.active {
            display: flex;
        }

        /* Botões do Menu de Níveis */
        .level-btn {
            position: relative;
            overflow: hidden;
        }
        .level-btn.completed {
            background-color: #10b981; /* emerald-500 */
            color: white;
            border-color: #047857; /* emerald-700 */
        }
        .moves-badge {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.9);
            color: #047857;
            padding: 2px 6px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active p-4 pb-8">
        <header class="text-center pt-8 pb-6">
            <h1 class="text-5xl font-title text-gray-800 drop-shadow-md">Estacionamento</h1>
            <p class="text-gray-600 font-bold mt-2 max-w-md mx-auto">
                Arraste os veículos para abrir caminho e tire o carro vermelho do estacionamento!
            </p>
        </header>

        <main class="flex-grow flex flex-col items-center w-full max-w-3xl mx-auto">
            <div class="bg-white/80 backdrop-blur p-6 rounded-2xl shadow-xl w-full border border-gray-200">
                <h2 class="text-2xl font-title text-center mb-4 text-gray-700">Selecione uma Fase</h2>
                <div id="level-grid" class="grid grid-cols-4 sm:grid-cols-5 gap-3 sm:gap-4">
                    <!-- Botões gerados via JS -->
                </div>
            </div>
        </main>
    </div>

    <div id="game-screen" class="screen p-4 pb-8">
        <div class="max-w-[450px] w-full mx-auto flex-grow flex flex-col pt-4">
            
            <div class="flex justify-between items-center mb-4">
                <button id="btn-back" class="btn bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-bold shadow-[0_4px_0_#374151]">
                    &larr; Menu
                </button>
                <h2 id="level-title" class="text-2xl font-title text-gray-800 m-0">Fase 1</h2>
                <button id="btn-restart" class="btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow-[0_4px_0_#1e3a8a]" title="Reiniciar Fase">
                    &#x21bb;
                </button>
            </div>

            <div class="bg-white/90 rounded-xl p-3 mb-4 shadow-md text-center border border-gray-300">
                <span class="text-lg font-bold text-gray-700">Movimentos: <span id="moves-counter" class="text-blue-600 text-xl">0</span></span>
            </div>

            <div id="game-board">
                <div class="exit-marker"></div>
                <div class="board-grid" id="grid-bg">
                    <!-- Células da grade injetadas aqui -->
                </div>
                <!-- Veículos injetados aqui -->
            </div>
        </div>
    </div>

    <div id="win-modal" class="modal">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-[90%] text-center border-4 border-emerald-500 shadow-2xl relative">
            <h2 class="text-4xl text-emerald-600 mb-2 font-title">Excelente!</h2>
            <p id="win-message" class="text-gray-700 font-bold mb-6 text-lg">Fase X Concluída em Y Movimentos!</p>
            
            <div class="flex flex-col gap-3">
                <button id="btn-next-level" class="btn w-full bg-emerald-500 text-white py-3 rounded-xl text-lg font-bold shadow-[0_4px_0_#047857]">
                    Próxima Fase
                </button>
                <button id="btn-modal-menu" class="btn w-full bg-gray-200 text-gray-800 py-3 rounded-xl text-lg font-bold shadow-[0_4px_0_#9ca3af]">
                    Voltar ao Menu
                </button>
            </div>
        </div>
    </div>

    <script>
        // Array rigorosamente de acordo com o pedido: [x, y, comprimento, isVertical, tipo]
        // Tipo: 0 = Carro Vermelho, 1 = Carro Amarelo, 2 = Caminhão Azul
        const levelsData = [
            // Fases 1 a 10 (Iniciante)
            [[0,0,2,0,1], [0,1,3,1,2], [1,2,2,0,0], [0,4,2,1,1], [3,1,3,1,2], [2,5,3,0,2], [4,4,2,0,1], [5,0,3,1,2]],
            [[0,0,2,1,1], [0,2,2,0,0], [0,3,3,0,2], [0,5,2,0,1], [3,0,3,0,2], [3,1,2,1,1], [2,4,2,1,1], [4,2,2,1,1], [5,1,3,1,2], [4,4,2,0,1], [3,5,2,0,1]],
            [[1,2,2,0,0], [1,3,2,0,1], [1,4,2,1,1], [2,5,2,0,1], [3,2,3,1,2], [5,2,3,1,2]],
            [[0,0,3,1,2], [1,2,2,0,0], [3,0,3,1,2], [2,3,2,1,1], [2,5,3,0,2], [3,3,3,0,2], [5,4,2,1,1]],
            [[0,0,2,0,1], [0,1,3,1,2], [0,4,2,1,1], [1,2,2,0,0], [1,3,3,0,2], [3,0,3,1,2], [4,1,3,1,2], [5,0,2,1,1], [5,2,2,1,1], [4,4,2,0,1], [4,5,2,0,1]],
            [[0,0,2,0,1], [0,1,2,0,1], [0,3,2,0,1], [0,4,2,1,1], [1,2,2,0,0], [3,0,2,1,1], [2,3,2,1,1], [3,2,3,1,2], [3,5,3,0,2], [4,1,3,1,2], [5,1,3,1,2]],
            [[1,0,2,1,1], [2,0,2,0,1], [4,0,2,1,1], [5,0,2,1,1], [1,2,2,0,0], [3,1,2,1,1], [5,2,2,1,1], [2,3,2,0,1], [3,4,2,1,1]],
            [[3,0,2,0,1], [5,0,3,1,2], [2,1,2,0,1], [4,1,2,1,1], [0,2,2,0,0], [2,2,2,1,1], [3,2,2,1,1], [0,3,2,0,1], [4,3,2,0,1], [0,4,2,0,1], [2,4,2,1,1], [3,4,3,0,2], [0,5,2,0,1], [3,5,3,0,2]],
            [[1,0,2,1,1], [2,0,2,0,1], [4,0,2,0,1], [3,1,2,1,1], [4,1,2,0,1], [0,2,2,0,0], [4,2,3,1,2], [5,2,2,1,1], [0,3,3,1,2], [1,3,3,0,2], [2,4,2,1,1], [5,4,2,1,1]],
            [[0,0,2,0,1], [0,1,2,0,1], [0,2,3,1,2], [0,5,2,0,1], [2,0,2,1,1], [1,2,2,0,0], [1,3,3,0,2], [3,4,2,1,1], [4,0,2,0,1], [4,4,2,0,1], [4,5,2,0,1], [5,1,3,1,2]],
            // Fases 11 a 20 (Intermediário)
            [[1,0,2,0,1], [0,0,3,1,2], [3,0,3,1,2], [1,2,2,0,0], [2,3,2,1,1], [3,3,3,0,2], [2,5,3,0,2], [5,4,2,1,1]],
            [[0,0,2,1,1], [1,0,2,0,1], [5,0,3,1,2], [0,2,2,0,0], [2,1,3,1,2], [3,3,3,0,2], [0,5,3,0,2], [4,4,2,1,1]],
            [[0,0,2,0,1], [2,0,2,0,1], [4,0,2,1,1], [2,1,2,1,1], [1,1,2,1,1], [3,2,2,0,0], [5,1,3,1,2], [0,2,3,1,2], [2,3,2,0,1], [4,4,2,0,1], [3,4,2,1,1], [1,5,2,0,1], [4,5,2,0,1]],
            [[0,0,2,0,1], [2,0,2,1,1], [4,1,2,0,1], [0,2,2,1,1], [1,2,2,1,1], [2,2,2,0,0], [4,2,2,1,1], [5,2,2,1,1], [2,3,2,0,1], [0,5,2,0,1], [2,4,2,1,1], [4,4,2,0,1]],
            [[0,0,2,0,1], [2,0,2,0,1], [0,1,2,0,1], [2,1,2,0,1], [4,0,3,1,2], [5,0,3,1,2], [0,2,3,1,2], [1,2,3,1,2], [2,2,2,0,0], [2,3,2,1,1], [3,3,2,1,1], [4,4,2,0,1], [1,5,2,0,1], [3,5,2,0,1]],
            [[0,0,2,0,1], [2,0,2,0,1], [4,0,2,1,1], [5,0,3,1,2], [0,2,2,1,1], [2,1,2,0,1], [1,3,2,1,1], [2,2,3,1,2], [3,2,2,0,0], [3,3,3,0,2], [0,5,2,0,1]],
            [[1,0,3,0,2], [0,0,2,1,1], [2,1,2,0,1], [4,1,2,0,1], [0,2,2,0,0], [2,2,2,1,1], [0,3,2,0,1], [0,4,3,0,2], [0,5,3,0,2], [3,3,3,1,2], [4,4,2,1,1], [5,4,2,1,1]],
            [[0,0,2,0,1], [2,0,2,1,1], [0,1,2,0,1], [4,0,3,1,2], [0,2,3,1,2], [1,2,2,0,0], [1,3,3,0,2], [1,4,2,0,1], [1,5,3,0,2]],
            [[2,0,2,1,1], [3,0,2,0,1], [1,2,2,1,1], [2,3,2,0,1], [2,2,2,0,0], [1,4,3,0,2], [4,3,2,1,1], [4,1,2,1,1]],
            [[0,0,2,1,1], [1,1,2,0,1], [3,0,3,0,2], [3,1,2,1,1], [5,2,3,1,2], [0,2,2,0,0], [2,2,2,1,1], [2,4,2,1,1], [3,4,2,0,1], [3,5,3,0,2]]
        ];

        const boardSize = 6;
        let currentLevel = 0;
        let moves = 0;
        let vehicles = [];
        let history = JSON.parse(localStorage.getItem('estacionamentoHistory')) || {};
        
        // Elementos DOM
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const levelGrid = document.getElementById('level-grid');
        const boardEl = document.getElementById('game-board');
        const gridBg = document.getElementById('grid-bg');
        const movesCounter = document.getElementById('moves-counter');
        const levelTitle = document.getElementById('level-title');
        
        const winModal = document.getElementById('win-modal');
        const winMessage = document.getElementById('win-message');
        const btnNextLevel = document.getElementById('btn-next-level');

        function saveHistory(level, movesMade) {
            if (!history[level] || movesMade < history[level]) {
                history[level] = movesMade;
                localStorage.setItem('estacionamentoHistory', JSON.stringify(history));
            }
        }

        function renderMenu() {
            levelGrid.innerHTML = '';
            levelsData.forEach((_, index) => {
                const isCompleted = history[index] !== undefined;
                const btn = document.createElement('button');
                
                let baseClasses = 'level-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 font-bold shadow-[0_4px_0_rgba(0,0,0,0.2)] h-20 transition-all active:translate-y-1 active:shadow-none';
                if (isCompleted) {
                    btn.className = `${baseClasses} bg-emerald-500 text-white border-emerald-700`;
                    btn.innerHTML = `
                        <span class="text-xl">${index + 1}</span>
                        <div class="moves-badge">${history[index]} mov.</div>
                    `;
                } else {
                    btn.className = `${baseClasses} bg-white text-gray-700 border-gray-300 hover:bg-gray-50`;
                    btn.innerHTML = `<span class="text-xl">${index + 1}</span>`;
                }
                
                btn.onclick = () => startGame(index);
                levelGrid.appendChild(btn);
            });
        }

        function initGrid() {
            gridBg.innerHTML = '';
            for (let i = 0; i < 36; i++) {
                const cell = document.createElement('div');
                cell.className = 'board-cell';
                gridBg.appendChild(cell);
            }
        }

        function startGame(levelIndex) {
            currentLevel = levelIndex;
            moves = 0;
            movesCounter.innerText = moves;
            levelTitle.innerText = `Fase ${levelIndex + 1}`;
            
            // Transformar os dados no formato interno [x, y, length, isVertical, type]
            vehicles = levelsData[levelIndex].map(data => ({
                x: data[0],
                y: data[1],
                length: data[2],
                isVertical: data[3] === 1,
                type: data[4]
            }));

            renderVehicles();
            
            menuScreen.classList.remove('active');
            gameScreen.classList.add('active');
        }

        function renderVehicles() {
            // Limpar veículos antigos
            const oldVehicles = document.querySelectorAll('.vehicle');
            oldVehicles.forEach(el => el.remove());

            vehicles.forEach((v, index) => {
                const el = document.createElement('div');
                el.className = `vehicle ${v.isVertical ? 'vertical' : 'horizontal'}`;
                el.dataset.index = index;
                el.dataset.type = v.type;

                updateVehicleDOM(el, v);
                setupDragEvents(el, v, index);
                boardEl.appendChild(el);
            });
        }

        function updateVehicleDOM(el, v) {
            if (v.isVertical) {
                el.style.height = `calc(${v.length * (100 / boardSize)}% - 6px)`;
                el.style.left = `${v.x * (100 / boardSize)}%`;
                el.style.top = `${v.y * (100 / boardSize)}%`;
            } else {
                el.style.width = `calc(${v.length * (100 / boardSize)}% - 6px)`;
                el.style.left = `${v.x * (100 / boardSize)}%`;
                el.style.top = `${v.y * (100 / boardSize)}%`;
            }
        }

        let activeEl = null;
        let activeIndex = null;
        let startClientX = 0, startClientY = 0;
        let startGridX = 0, startGridY = 0;
        let minBound = 0, maxBound = 0;

        function setupDragEvents(el, v, index) {
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // Previne scroll
                
                activeEl = el;
                activeIndex = index;
                
                startClientX = e.clientX;
                startClientY = e.clientY;
                startGridX = v.x;
                startGridY = v.y;
                
                calculateBounds(activeIndex);
                
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        }

        function calculateBounds(index) {
            const v = vehicles[index];
            const grid = Array(6).fill(null).map(() => Array(6).fill(false));
            
            // Popula a matriz com todos OS OUTROS veículos
            vehicles.forEach((other, idx) => {
                if (idx === index) return;
                for (let i = 0; i < other.length; i++) {
                    if (other.isVertical) grid[other.y + i][other.x] = true;
                    else grid[other.y][other.x + i] = true;
                }
            });

            if (v.isVertical) {
                minBound = v.y; maxBound = v.y;
                // Olha pra cima
                for (let y = v.y - 1; y >= 0; y--) {
                    if (grid[y][v.x]) break;
                    minBound = y;
                }
                // Olha pra baixo
                for (let y = v.y + v.length; y < boardSize; y++) {
                    if (grid[y][v.x]) break;
                    maxBound = y - v.length + 1;
                }
            } else {
                minBound = v.x; maxBound = v.x;
                // Olha pra esquerda
                for (let x = v.x - 1; x >= 0; x--) {
                    if (grid[v.y][x]) break;
                    minBound = x;
                }
                // Olha pra direita
                for (let x = v.x + v.length; x < boardSize; x++) {
                    if (grid[v.y][x]) break;
                    maxBound = x - v.length + 1;
                }
            }
        }

        function onPointerMove(e) {
            if (!activeEl) return;
            e.preventDefault();

            const v = vehicles[activeIndex];
            const cellSizePx = boardEl.getBoundingClientRect().width / boardSize;

            if (v.isVertical) {
                const deltaY = e.clientY - startClientY;
                const cellsMoved = Math.round(deltaY / cellSizePx);
                let newY = startGridY + cellsMoved;
                
                newY = Math.max(minBound, Math.min(newY, maxBound));
                v.y = newY;
                activeEl.style.top = `${newY * (100 / boardSize)}%`;
            } else {
                const deltaX = e.clientX - startClientX;
                const cellsMoved = Math.round(deltaX / cellSizePx);
                let newX = startGridX + cellsMoved;
                
                newX = Math.max(minBound, Math.min(newX, maxBound));
                v.x = newX;
                activeEl.style.left = `${newX * (100 / boardSize)}%`;
            }
        }

        function onPointerUp(e) {
            if (!activeEl) return;

            const v = vehicles[activeIndex];
            
            // Regra: Conta movimento apenas se soltar em posição diferente
            if (v.x !== startGridX || v.y !== startGridY) {
                moves++;
                movesCounter.innerText = moves;
            }

            activeEl = null;
            activeIndex = null;

            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);

            checkWin();
        }

        function checkWin() {
            // O carro alvo sempre é o tipo 0 (Vermelho)
            const targetCar = vehicles.find(v => v.type === 0);
            
            // Condição de vitória: carro vermelho encostou na borda direita
            // Estando na linha Y=2 (índice 2), a saída é x=4 (para len=2) ocupando 4 e 5.
            if (targetCar && targetCar.x + targetCar.length >= boardSize) {
                saveHistory(currentLevel, moves);
                
                winMessage.innerText = `Fase ${currentLevel + 1} concluída em ${moves} movimentos!`;
                
                // Exibir botão "Próxima Fase" se não for a última
                if (currentLevel < levelsData.length - 1) {
                    btnNextLevel.style.display = 'block';
                } else {
                    btnNextLevel.style.display = 'none';
                }
                
                setTimeout(() => {
                    winModal.classList.add('active');
                }, 150);
            }
        }

        document.getElementById('btn-back').addEventListener('click', () => {
            gameScreen.classList.remove('active');
            menuScreen.classList.add('active');
            renderMenu();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            startGame(currentLevel);
        });

        document.getElementById('btn-modal-menu').addEventListener('click', () => {
            winModal.classList.remove('active');
            gameScreen.classList.remove('active');
            menuScreen.classList.add('active');
            renderMenu();
        });

        btnNextLevel.addEventListener('click', () => {
            winModal.classList.remove('active');
            if (currentLevel < levelsData.length - 1) {
                startGame(currentLevel + 1);
            }
        });

        // Previne comportamentos drag nativos indesejados no navegador
        document.addEventListener('dragstart', (e) => e.preventDefault());

        /* INITIAL START */
        initGrid();
        renderMenu();

    </script>
</body>
</html>
